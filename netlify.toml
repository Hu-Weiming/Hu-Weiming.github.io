[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.160.0"
  HUGO_ENVIRONMENT = "production"

# Temporary homepage for the MySQL review page.
# Remove this block to restore the blog homepage.
[[redirects]]
  from = "/"
  to = "/mysql/index.html"
  status = 200
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
